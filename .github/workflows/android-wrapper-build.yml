name: Android compatibility app build

on:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/android-wrapper-build.yml'
  pull_request:
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/android-wrapper-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          test -s android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sleeping-dogs-android-wrapper-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
