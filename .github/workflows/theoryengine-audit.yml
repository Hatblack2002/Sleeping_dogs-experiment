name: TheoryEngine feasibility audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
  push:
    paths:
      - ".github/workflows/theoryengine-audit.yml"
      - "scripts/audit_theoryengine.py"
      - "scripts/probe_android_header.py"
      - "tests/**"
      - "README.md"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test audit tooling
        run: |
          python -m py_compile scripts/audit_theoryengine.py scripts/probe_android_header.py
          python -m unittest discover -s tests -v

      - name: Fetch public upstream for temporary analysis
        run: git clone --depth 1 https://github.com/SDmodding/TheoryEngine.git "$RUNNER_TEMP/TheoryEngine"

      - name: Record upstream revision
        id: upstream
        working-directory: ${{ runner.temp }}/TheoryEngine
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Scan platform assumptions and licensing signals
        run: |
          python scripts/audit_theoryengine.py \
            --source "$RUNNER_TEMP/TheoryEngine" \
            --output audit-report.md \
            --revision "${{ steps.upstream.outputs.sha }}"

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Probe upstream umbrella header for Android ARM64 compatibility
        run: |
          python scripts/probe_android_header.py \
            --compiler "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" \
            --sysroot "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
            --source "$RUNNER_TEMP/TheoryEngine" \
            --output android-header-probe.md
          printf "\n\n---\n\n" >> audit-report.md
          cat android-header-probe.md >> audit-report.md

      - name: Print report in workflow logs
        run: cat audit-report.md

      - name: Publish audit report
        uses: actions/upload-artifact@v4
        with:
          name: sleeping-dogs-feasibility-audit
          path: audit-report.md
          if-no-files-found: error
          retention-days: 30
