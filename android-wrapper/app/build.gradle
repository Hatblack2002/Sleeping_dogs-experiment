plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vertil.sleepingdogs'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vertil.sleepingdogs'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
